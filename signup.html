<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Signup</title>
        <link rel="stylesheet" href="./css/reset.css" />
        <link rel="stylesheet" href="./css/signup.css" />
        <link rel="icon" type="image/x-icon" href="./assets/logo/panda/panda face@3x.png" />
    </head>
    <body>
        <div class="container">
            <a href="./"><img src="./assets/logo/panda/Property 1=lg.png" alt="Logo" class="logo btn" ></a>
            <div class="signup-form">
                <form class="signup">
                    <div class="email-field">
                        <h2>이메일</h2>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            placeholder="이메일을 입력해주세요"
                            class="email-input"
                        />
                        <!-- class는 CSS 스타일링과 JS 선택용. id/name은 폼 데이터 제출, 브라우저 자동 완성, 접근성용 -->
                    </div>
                    <div class="nickname-field">
                        <h2>닉네임</h2>
                        <input
                            type="text"
                            id="nickname"
                            name="nickname"
                            autocomplete="nickname"
                            placeholder="닉네임을 입력해주세요"
                            class="nickname-input"
                        />
                    </div>
                    <div class="password-field">
                        <h2>비밀번호</h2>
                        <div class="password-field">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                autocomplete="current-password"
                                placeholder="비밀번호를 입력해주세요"
                                class="password-input"
                            />
                            <button
                                type="button"
                                class="password-toggle-btn"
                                tabindex="-1"
                                aria-label="비밀번호 표시"
                            >
                            <!-- tabindex="-1"은 키보드 포커스를 받지 않도록 설정 -->
                                <img
                                    src="./assets/btn/Property 1=Variant2.png"
                                    alt=""
                                    class="password-toggle-icon"
                                />
                            </button>
                        </div>
                    </div>
                    <div class="password-field">
                        <h2>비밀번호 확인</h2>
                        <div class="password-field">
                            <input
                                type="password"
                                id="password-confirm"
                                name="password-confirm"
                                autocomplete="current-password"
                                placeholder="비밀번호를 다시 한 번 입력해주세요"
                                class="password-input"
                            />
                            <button
                                type="button"
                                class="password-toggle-btn"
                                tabindex="-1"
                                aria-label="비밀번호 표시"
                            >
                            <!-- tabindex="-1"은 키보드 포커스를 받지 않도록 설정 -->
                                <img
                                    src="./assets/btn/Property 1=Variant2.png"
                                    alt=""
                                    class="password-toggle-icon"
                                />
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="signup-btn">회원가입</button>
                </form>
                <div class="social-link">
                    <div class="social-link-content">
                        <p class="social-link-title">간편로그인하기</p>
                        <div class="social-link-btns">
                            <a class="google-login-btn" href="https://www.google.com/"><img src="./assets/logo/social/social_google.png" alt="Google Login"></a>
                            <a class="kakao-login-btn" href="https://www.kakaocorp.com/page/"><img src="./assets/logo/social/social_kakao.png" alt="Kakao Login"></a>
                        </div>
                    </div>
                </div>
                <div class="login-link">
                    <p>이미 회원이신가요?</p><a href="./login.html">로그인</a>
                </div>
            </div>
        </div>
    </body>
</html>
