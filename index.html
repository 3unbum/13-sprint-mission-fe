<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="icon" type="image/x-icon" href="./assets/logo/panda/panda face@3x.png" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PBKYHFT9HC"></script>

  <body>
    <header>
      <div class="header-container">
        <a href="/">
          <img
            src="./assets/logo/panda/Property 1=sm.png"
            alt="판다마켓"
            class="logo btn"
          />
        </a>
        <a href="./login.html" class="login-btn btn">로그인</a>
      </div>
    </header>

    <main>
      <section class="landing1-container">
        <div class="landing1">
          <div class="landing1-description">
            <p class="landing1-text">일상의 모든 물건을<br />거래해 보세요</p>
            <a url="/items" href="./items.html" class="item-btn btn"
              >구경하러 가기</a
            >
          </div>
          <img
            src="./assets/img/Img_home_top.png"
            alt="랜딩이미지상단"
            class="landing-top-img"
          />
        </div>
      </section>

      <section class="section1 st">
        <div class="section1-container">
          <img
            src="./assets/img/Img_home_01.png"
            alt="섹션1이미지"
            class="section-img"
          />
          <div class="section1-description">
            <p class="section-title">Hot item</p>
            <div class="section1-content">
              <p class="content-title-left">인기 상품을<br />확인해 보세요</p>
              <p class="content-text-left">
                가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요
              </p>
            </div>
          </div>
        </div>
      </section>

      <section class="section2 st">
        <div class="section2-container">
          <img
            src="./assets/img/Img_home_02.png"
            alt="섹션2이미지"
            class="section-img"
          />
          <div class="section2-description">
            <p class="section-title">Search</p>
            <div class="section2-content">
              <p class="content-title-right">
                구매를 원하는<br />상품을 검색하세요
              </p>
              <p class="content-text-right">
                구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
              </p>
            </div>
          </div>
        </div>
      </section>

      <section class="section3 st">
        <div class="section3-container">
          <img
            src="./assets/img/Img_home_03.png"
            alt="섹션3이미지"
            class="section-img"
          />
          <div class="section3-description">
            <p class="section-title">Register</p>
            <div class="section3-content">
              <p class="content-title-left">
                판매를 원하는<br />상품을 등록하세요
              </p>
              <p class="content-text-left">
                어떤 물건이든 판매하고 싶은 상품을<br />
                쉽게 등록하세요
              </p>
            </div>
          </div>
        </div>
      </section>

      <section class="landing2-container">
        <div class="landing2">
          <div class="landing2-description">
            <p class="landing2-text">믿을 수 있는<br />판다마켓 중고 거래</p>
          </div>
          <img
            src="./assets/img/Img_home_bottom.png"
            alt="랜딩이미지하단"
            class="landing-bottom-img"
          />
        </div>
      </section>
    </main>

    <footer>
      <div class="footer-container">
        <div class="footer-component">
          <div class="footer-left">
            <span class="copyright">&copy;codeit - 2024</span>
          </div>
          <div class="footer-center">
            <a href="privacy.html" class="footer-btn btn">Privacy Policy</a>
            <a href="faq.html" class="footer-btn btn">FAQ</a>
          </div>
          <div class="footer-right">
            <a
              href="https://www.facebook.com"
              target="_blank"
              rel="noopener noreferrer"
              class="btn"
              ><img src="./assets/logo/social/ic_facebook.svg" alt="페이스북" />
            </a>
            <a
              href="https://twitter.com"
              target="_blank"
              rel="noopener noreferrer"
              class="btn"
              ><img src="./assets/logo/social/ic_twitter.svg" alt="트위터"
            /></a>
            <a
              href="https://www.youtube.com"
              target="_blank"
              rel="noopener noreferrer"
              class="btn"
              ><img src="./assets/logo/social/ic_youtube.svg" alt="유튜브"
            /></a>
            <a
              href="https://www.instagram.com"
              target="_blank"
              rel="noopener noreferrer"
              class="btn"
              ><img

                alt="인스타그램"
            /></a>
          </div>
        </div>
      </div>
